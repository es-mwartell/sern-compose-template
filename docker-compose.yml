services:
  myapp:
    build:
      context: .
    container_name: myapp
    environment:
      - NODE_ENV=production
      - TZ=Australia/Brisbane
      - PORT=8080
      - DB_PATH=/data/db.sqlite
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped

  sqlite-web:
    build:
      context: .
      dockerfile: sqlite-web.Dockerfile
    image: sern-compose-template/sqlite-web
    container_name: sqlite-web
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--timeout=5", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 10s
      retries: 2
      start_period: 10s
